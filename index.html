<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E Qariin - Multilingual Quran JSON Dataset &amp; Metadata Repository</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- SEO & Basic Meta Tags -->
    <meta name="description" content="E Qariin - Structured JSON dataset and metadata repository for Holy Quran Surahs with official translations across 9 languages (Arabic, Indonesian, English, Mandarin, Spanish, Japanese, Turkish, French, Malay)." />
    <meta name="keywords" content="Quran Dataset, Quran JSON, Quran Metadata, Multilingual Quran, E Qariin, Open Data Quran, Al-Baqarah JSON, Ali Imran JSON, Quran Repository" />
    <meta name="author" content="E Qariin" />
    <meta name="theme-color" content="#047857" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/favicon.png?v=3" />

    <!-- Open Graph / Facebook / WhatsApp / Telegram / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="E Qariin" />
    <meta property="og:url" content="https://eqariin.ai.studio/" />
    <meta property="og:title" content="E Qariin - Multilingual Quran JSON Dataset &amp; Metadata Repository" />
    <meta property="og:description" content="Structured JSON dataset and metadata repository of the Holy Quran featuring Arabic text and translations across 9 official languages." />
    <meta property="og:image" content="https://eqariin.ai.studio/og-image.png" />
    <meta property="og:image:secure_url" content="https://eqariin.ai.studio/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="E Qariin - Multilingual Quran JSON Dataset &amp; Metadata Repository" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Oxposa" />
    <meta name="twitter:creator" content="@Oxposa" />
    <meta name="twitter:domain" content="eqariin.ai.studio" />
    <meta name="twitter:url" content="https://eqariin.ai.studio/" />
    <meta name="twitter:title" content="E Qariin - Multilingual Quran JSON Dataset &amp; Metadata Repository" />
    <meta name="twitter:description" content="Structured JSON dataset and metadata repository of the Holy Quran featuring Arabic text and translations across 9 official languages." />
    <meta name="twitter:image" content="https://eqariin.ai.studio/og-image.png" />
    <meta name="twitter:image:src" content="https://eqariin.ai.studio/og-image.png" />
    <meta name="twitter:image:alt" content="E Qariin - Multilingual Quran JSON Dataset &amp; Metadata Repository" />

    <script>
      // Dynamically set og:url to the current origin / location
      try {
        var canonicalUrl = window.location.href;
        var ogUrlMeta = document.createElement('meta');
        ogUrlMeta.setAttribute('property', 'og:url');
        ogUrlMeta.setAttribute('content', canonicalUrl);
        document.head.appendChild(ogUrlMeta);

        // Ensure og:image uses absolute URL if possible
        var ogImg = document.querySelector('meta[property="og:image"]');
        if (ogImg && ogImg.getAttribute('content').startsWith('/')) {
          var absImgUrl = window.location.origin + ogImg.getAttribute('content');
          ogImg.setAttribute('content', absImgUrl);
          var twitterImg = document.querySelector('meta[name="twitter:image"]');
          if (twitterImg) twitterImg.setAttribute('content', absImgUrl);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
