<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Decorative Islamic Geometric Shapes -->
  <g transform="translate(1020, 120) opacity(0.15) scale(1.6)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(0)"/>
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(45)"/>
  </g>
  <g transform="translate(120, 520) opacity(0.12) scale(1.3)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(0)"/>
    <rect x="-120" y="-120" width="240" height="240" fill="none" stroke="url(#gold)" stroke-width="2" transform="rotate(45)"/>
  </g>

  <!-- Main Border Card -->
  <rect x="70" y="70" width="1060" height="490" rx="28" fill="rgba(6, 78, 59, 0.45)" stroke="rgba(52, 211, 153, 0.35)" stroke-width="2" />

  <!-- Top Badge -->
  <g transform="translate(120, 125)">
    <rect width="360" height="42" rx="21" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="7" fill="#10b981"/>
    <text x="46" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" letter-spacing="1.5">JSON DATASET &amp; METADATA REPOSITORY</text>
  </g>

  <!-- Title & Arabic Calligraphy emblem -->
  <g transform="translate(120, 235)">
    <!-- Quran Book / JSON Icon -->
    <g transform="translate(0, -50) scale(1.4)">
      <rect x="0" y="0" width="50" height="60" rx="6" fill="#047857" stroke="url(#gold)" stroke-width="2"/>
      <path d="M 10 12 L 40 12 M 10 22 L 40 22 M 10 32 L 30 32" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="90" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">E Qariin</text>
    <text x="370" y="-12" font-family="'Traditional Arabic', 'Amiri', serif" font-size="52" font-weight="bold" fill="url(#gold)">القرآن الكريم</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#6ee7b7">Multilingual Holy Quran JSON Open Dataset</text>
  </g>

  <!-- Subtitle Description -->
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" fill="#ecfdf5">
    Structured JSON metadata repository of Quran Surahs &amp; Verses across 9 official languages:
  </text>
  <text x="120" y="393" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#a7f3d0">
    Arabic, Indonesian, English, Mandarin, Spanish, Japanese, Turkish, French, &amp; Malay.
  </text>

  <!-- Language Tags Pills (English labels) -->
  <g transform="translate(120, 445)">
    <!-- Arabic -->
    <rect x="0" y="0" width="80" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="40" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Arabic</text>

    <!-- Indonesian -->
    <rect x="92" y="0" width="115" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="149.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Indonesian</text>

    <!-- English -->
    <rect x="219" y="0" width="85" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="261.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">English</text>

    <!-- Mandarin -->
    <rect x="316" y="0" width="95" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="363.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Mandarin</text>

    <!-- Spanish -->
    <rect x="423" y="0" width="85" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="465.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Spanish</text>

    <!-- Japanese -->
    <rect x="520" y="0" width="90" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="565" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Japanese</text>

    <!-- Turkish -->
    <rect x="622" y="0" width="80" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="662" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Turkish</text>

    <!-- French -->
    <rect x="714" y="0" width="80" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="754" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">French</text>

    <!-- Malay -->
    <rect x="806" y="0" width="75" height="36" rx="10" fill="#047857" stroke="rgba(255,255,255,0.15)" />
    <text x="843.5" y="23" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Malay</text>
  </g>
</svg>
